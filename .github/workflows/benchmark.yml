name: LLM Speed Benchmark

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      runs:
        description: 'Number of runs per model'
        required: false
        default: '1'
      include-expensive:
        description: 'Include expensive models'
        required: false
        default: 'false'
        type: boolean
      include-paid:
        description: 'Include paid models (disables free-filter)'
        required: false
        default: 'true'
        type: boolean
      effort-sweep:
        description: 'Test all reasoning effort levels'
        required: false
        default: 'false'
        type: boolean
      concurrency:
        description: 'Concurrent API calls'
        required: false
        default: '10'
      skip-tested:
        description: 'Skip already-tested models'
        required: false
        default: 'true'
        type: boolean
      retest-suspicious:
        description: 'Retest models with suspicious results (TPS>2000, tokens<500, TTFT=0)'
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: write

# Explicit allowlist of repo secrets. The old toJSON(secrets) dump tripped
# GitHub's malicious-workflow gate. This block is the single source of truth:
# steps read their name list from it. Add new repo secrets here only.
