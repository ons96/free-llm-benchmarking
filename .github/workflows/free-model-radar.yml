  EIGHT88AVI_API_KEY: ${{ secrets.EIGHT88AVI_API_KEY }}
  EIGHT88AVI_KEY: ${{ secrets.EIGHT88AVI_KEY }}
  EVOLVEX_KEY: ${{ secrets.EVOLVEX_KEY }}
  FREEMODEL: ${{ secrets.FREEMODEL }}
  FREEMODEL_API_KEY: ${{ secrets.FREEMODEL_API_KEY }}
  FREETHEAI_API_KEY: ${{ secrets.FREETHEAI_API_KEY }}
  FREE_GEMINI_KEY: ${{ secrets.FREE_GEMINI_KEY }}
