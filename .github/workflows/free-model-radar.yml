  BUDDYBACKEND_KEY: ${{ secrets.BUDDYBACKEND_KEY }}
  CEREBRAS: ${{ secrets.CEREBRAS }}
  CHOOSEC_API_KEY: ${{ secrets.CHOOSEC_API_KEY }}
  CHOOSEC_KEY: ${{ secrets.CHOOSEC_KEY }}
  CONDUIT_API_KEY: ${{ secrets.CONDUIT_API_KEY }}
  CONDUIT_KEY: ${{ secrets.CONDUIT_KEY }}
  CROWLLM_API_KEY: ${{ secrets.CROWLLM_API_KEY }}
