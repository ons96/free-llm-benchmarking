  SH00T_API_KEY_2: ${{ secrets.SH00T_API_KEY_2 }}
  TOGETHER_API_KEY: ${{ secrets.TOGETHER_API_KEY }}
  TOKENLB_API_KEY: ${{ secrets.TOKENLB_API_KEY }}
  TOKENREPLY_API_KEY: ${{ secrets.TOKENREPLY_API_KEY }}
  TOKENROUTER_API_KEY: ${{ secrets.TOKENROUTER_API_KEY }}
  VOIDAI_API_KEY: ${{ secrets.VOIDAI_API_KEY }}
  VPS_GATEWAY_API_KEY: ${{ secrets.VPS_GATEWAY_API_KEY }}
  XIAOMIMIMO_API_KEY: ${{ secrets.XIAOMIMIMO_API_KEY }}
  XINJIANYA_API_KEY: ${{ secrets.XINJIANYA_API_KEY }}
  YZGPT_KEY1: ${{ secrets.YZGPT_KEY1 }}
  YZGPT_KEY2: ${{ secrets.YZGPT_KEY2 }}
  ZANITY_API_KEY: ${{ secrets.ZANITY_API_KEY }}
  ZENLLM_API_KEY: ${{ secrets.ZENLLM_API_KEY }}
  ZENMUX_API_KEY: ${{ secrets.ZENMUX_API_KEY }}
  ZHANGYU_API_KEY: ${{ secrets.ZHANGYU_API_KEY }}

concurrency:
  group: free-model-radar
  cancel-in-progress: false

jobs:
  radar:
    name: Run Free Model Radar
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, pinned for supply-chain safety
        with:
          token: ${{ secrets.BENCHMARK_PUSH_TOKEN || secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7, pinned
        with:
          activate-environment: true
          enable-cache: true
          cache-dependency-glob: |
            requirements.txt
            uv.lock

      - name: Install dependencies
        run: |
          uv pip install -r requirements.txt
          uv pip install httpx pyyaml beautifulsoup4 lxml tqdm

      - name: Restore opencode config from repo
        run: |
          mkdir -p ~/.config/opencode
          cp config/opencode-runner.json ~/.config/opencode/opencode.json
          echo "Config restored. Providers: $(uv run python -c "import json; d=json.load(open('/home/runner/.config/opencode/opencode.json')); print(len(d.get('provider', {})))")"

      - name: Build ~/.env and ~/.secrets/ from repo secrets
        run: |
          python3 <<'PYEOF'
          import os, yaml
          WF = os.path.join(os.environ["GITHUB_WORKSPACE"], ".github/workflows/free-model-radar.yml")
          allow = list(yaml.safe_load(open(WF))["env"])
          secrets = {n: os.environ[n] for n in allow if os.environ.get(n)}
          home = os.path.expanduser("~")
          env_path = os.path.join(home, ".env")
          sec_dir = os.path.join(home, ".secrets")
          os.makedirs(sec_dir, exist_ok=True)
          skip_names = {"BENCHMARK_PUSH_TOKEN","OPENCODE_JSON_BASE64","GITHUB_TOKEN","GH_TOKEN","HF_TOKEN"}
          env_written = sec_written = 0
          with open(env_path, "w") as f:
              for name, val in sorted(secrets.items()):
                  if val is None or val == "":
                      continue
                  if name in skip_names:
                      continue
                  if name.endswith("_URL") or name.endswith("_BASE_URL") or name.endswith("_HOST"):
                      continue
                  f.write(f"{name}={val}\n")
                  env_written += 1
                  file_name = name.lower().replace("_", "-")
                  file_path = os.path.join(sec_dir, file_name)
                  with open(file_path, "w") as g:
                      g.write(val + ("\n" if not val.endswith("\n") else ""))
                  sec_written += 1
          print(f"~/.env: {env_written} keys, ~/.secrets/: {sec_written} files")
          PYEOF
          chmod 600 ~/.env
          chmod 700 ~/.secrets
          chmod 600 ~/.secrets/* 2>/dev/null || true

      - name: Initialize database
        run: |
          uv run python -m freeradar --help || true

      - name: Run Free Model Radar
        env:
          HOME: /home/runner
        run: |
          set -a
          . ~/.env
          set +a

          ARGS=""

          if [ "${{ github.event.inputs.skip-discovery }}" = "true" ]; then
            ARGS="$ARGS --skip-discovery"
          fi

          if [ "${{ github.event.inputs.skip-verification }}" = "true" ]; then
            ARGS="$ARGS --skip-verification"
          fi

          if [ "${{ github.event.inputs.skip-aliases }}" = "true" ]; then
            ARGS="$ARGS --skip-aliases"
          fi

          if [ "${{ github.event.inputs.apply-aliases }}" = "true" ]; then
            ARGS="$ARGS --apply-aliases --dry-run-aliases=false"
          fi

          if [ -n "${{ github.event.inputs.max-verify }}" ]; then
            ARGS="$ARGS --max-verify ${{ github.event.inputs.max-verify }}"
          fi

          ARGS="$ARGS --json"

          echo "Running: python -m freeradar $ARGS"
          uv run python -m freeradar $ARGS

      - name: Generate dashboard
        if: always()
        run: |
          uv run python -m freeradar.dashboard --html docs/dashboard.html --days 7 --top 20 || true

      - name: "Fail-safe: scan job log for leaked secrets"
        if: always()
        run: |
          python3 <<'PYEOF'
          import os, subprocess, sys, yaml
          WF = os.path.join(os.environ["GITHUB_WORKSPACE"], ".github/workflows/free-model-radar.yml")
          allow = list(yaml.safe_load(open(WF))["env"])
          secrets_ctx = {n: os.environ[n] for n in allow if os.environ.get(n)}
          hits = []
          for name, val in secrets_ctx.items():
              if not val or len(val) < 12:
                  continue
              try:
                  r = subprocess.run(
                      ["grep", "-rl", val, "/home/runner/work/", "--include=*.log", "--include=*.txt"],
                      capture_output=True, text=True, timeout=30
                  )
                  if r.stdout.strip():
                      hits.append((name, r.stdout.strip().splitlines()[0]))
              except Exception:
                  pass
          if hits:
              print(f"::error::SECRET LEAK DETECTED in {len(hits)} files:")
              for name, path in hits:
                  print(f"  {name} -> {path}")
              sys.exit(1)
          print(f"Scanned {len(secrets_ctx)} secrets, no leaks in /home/runner/work/.")
          PYEOF

      - name: "Fail-safe: scan publish artifacts for leaked secrets"
        if: always()
        run: |
          python3 <<'PYEOF'
          import os, subprocess, sys, yaml
          WF = os.path.join(os.environ["GITHUB_WORKSPACE"], ".github/workflows/free-model-radar.yml")
          allow = list(yaml.safe_load(open(WF))["env"])
          secrets_ctx = {n: os.environ[n] for n in allow if os.environ.get(n)}
          targets = ["data/free_models.json", "docs/dashboard.html", "docs/dashboard.json"]
          hits = []
          for name, val in secrets_ctx.items():
              if not val or len(val) < 12:
                  continue
              if name == "BENCHMARK_PUSH_TOKEN":
                  continue
              for tgt in targets:
                  if not os.path.exists(tgt):
                      continue
                  try:
                      r = subprocess.run(["grep", "-l", "-F", val, tgt], capture_output=True, text=True, timeout=30)
                      if tgt in r.stdout:
                          hits.append((name, tgt))
                  except Exception:
                      pass
              # binary DB: scan strings output
              db = "data/free_models.db"
              if os.path.exists(db):
                  try:
                      r1 = subprocess.run(["strings", db], capture_output=True, text=True, timeout=30)
                      if val in r1.stdout:
                          hits.append((name, db))
                  except Exception:
                      pass
          if hits:
              print(f"::error::SECRET LEAK DETECTED in {len(hits)} publish artifact(s):")
              for name, path in hits:
                  print(f"  {name} -> {path}")
              sys.exit(1)
          print("Publish artifacts clean: no secret values found.")
          PYEOF

      - name: Commit updated data files
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Add changed data files
          git add data/free_models.db data/free_models.json 2>/dev/null || true
          git add docs/dashboard.html docs/dashboard.json 2>/dev/null || true

          # Only commit if there are changes
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update free-model radar data [skip ci]"
            if [ -z "${{ secrets.BENCHMARK_PUSH_TOKEN }}" ]; then
              echo "::warning::BENCHMARK_PUSH_TOKEN secret not set; push to protected main will fail. Set admin PAT w/ repo scope."
            fi
            for attempt in 1 2 3 4 5; do
              if git push; then
                echo "push succeeded on attempt $attempt"; break
              fi
              echo "push rejected (attempt $attempt), rebasing onto origin/main"
              git fetch origin main
              git -c rebase.autoStash=true rebase -X ours origin/main || { git rebase --abort; echo "::error::rebase failed unexpectedly"; exit 1; }
              if [ "$attempt" = "5" ]; then echo "::error::push failed after 5 attempts"; exit 1; fi
              sleep $((attempt * 5))
            done
          fi
        env:
          GH_TOKEN: ${{ secrets.BENCHMARK_PUSH_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Deploy dashboard to GitHub Pages
        if: success()
        uses: peaceiris/actions-gh-pages@373f7f263a76c20808c831209c920827a82a2847 # v3, pinned
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          enable_jekyll: false

      - name: Summary
        if: always()
        run: |
          echo "## Free Model Radar Run Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          uv run python - <<'PY' >> "$GITHUB_STEP_SUMMARY" || true
          import json
          try:
              with open('data/free_models.json') as f:
                  data = json.load(f)
              print(f"Total models: {len(data.get('models', []))}")
              print(f"Aliases: {len(data.get('aliases', []))}")
              for a in data.get('aliases', []):
                  print(f"  {a['alias']}: {a.get('provider')}/{a.get('model_id')}")
          except Exception as e:
              print(f'Could not read summary: {e}')
          PY
