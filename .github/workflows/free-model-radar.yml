name: Free Model Radar

on:
  schedule:
    - cron: '0 4 * * *'  # Daily at 04:00 UTC
  workflow_dispatch:
    inputs:
      skip-discovery:
        description: 'Skip discovery phase'
        required: false
        default: false
        type: boolean
      skip-verification:
        description: 'Skip verification phase'
        required: false
        default: false
        type: boolean
      skip-aliases:
        description: 'Skip alias updates'
        required: false
        default: false
        type: boolean
      apply-aliases:
        description: 'Actually apply alias changes (not dry-run)'
        required: false
        default: false
        type: boolean
      max-verify:
        description: 'Max models to verify (default: all)'
        required: false
        default: ''
        type: string

permissions:
  contents: write

# Explicit allowlist of repo secrets. The old toJSON(secrets) dump tripped
# GitHub's malicious-workflow gate. This block is the single source of truth:
# the build and leak-scan steps read their name list from it. Add new repo
# secrets here only.
